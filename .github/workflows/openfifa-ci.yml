name: OpenFootball CI

on:
  push:
    branches: [main, "ralph/*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Nightly at 2am UTC for performance/visual regression tests
    - cron: "0 2 * * *"

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  PROJECT_PATH: ./OpenFifa

jobs:
  # ─── GATE: skip Unity jobs cleanly until a license secret exists ──
  license-check:
    name: Unity license present
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Unity license secrets (UNITY_LICENSE or UNITY_EMAIL+UNITY_PASSWORD); Unity jobs skipped."
          fi
  # ─── FAST: EditMode Tests (< 2 minutes) ────────────────────────
  editmode-tests:
    name: EditMode Tests
    runs-on: ubuntu-latest
    needs: license-check
    if: needs.license-check.outputs.ok == 'true' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        id: editmode
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: editmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Tests
          # Slow tests (difficulty ladder, style stats: tens of minutes) run nightly instead.
          customParameters: -testCategory "!Slow"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editmode-results
          path: editmode-results

  # ─── MEDIUM: PlayMode Tests (5-15 minutes) ─────────────────────
  playmode-tests:
    name: PlayMode Tests
    runs-on: ubuntu-latest
    needs: [license-check, editmode-tests]
    if: needs.license-check.outputs.ok == 'true' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        id: playmode
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: playmode
          artifactsPath: playmode-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: PlayMode Tests
          customParameters: >-
            -testCategory "Physics,Gameplay,AI,StateMachine,E2E,Animation,Audio"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playmode-results
          path: playmode-results

  # ─── SLOW: Platform Builds (15-30 minutes) ────────────────────
  platform-builds:
    name: Platform Builds (macOS + iPad)
    runs-on: macos-latest
    needs: [license-check, playmode-tests]
    if: needs.license-check.outputs.ok == 'true' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build macOS
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: StandaloneOSX
          buildMethod: OpenFifa.Editor.BuildScript.BuildMacOSDev

      - name: Build iPad
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildMethod: OpenFifa.Editor.BuildScript.BuildIOS

      - name: Verify platform builds
        run: |
          chmod +x ./scripts/verify-build.sh
          ./scripts/verify-build.sh ./OpenFifa/build/macOS ./OpenFifa/build/iOS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build
          path: OpenFifa/build/macOS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-build
          path: OpenFifa/build/iOS

  # ─── NIGHTLY: Performance + Visual Regression ──────────────────
  performance-tests:
    name: Performance & Visual Regression
    runs-on: macos-latest
    needs: license-check
    if: needs.license-check.outputs.ok == 'true' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: playmode
          artifactsPath: perf-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Performance Tests
          customParameters: >-
            -testCategory "Performance,VisualRegression"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results

  # ─── NIGHTLY: Asset Integrity ──────────────────────────────────
  asset-integrity:
    name: Asset Integrity
    runs-on: ubuntu-latest
    needs: license-check
    if: needs.license-check.outputs.ok == 'true' && github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: asset-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Asset Integrity
          customParameters: >-
            -testCategory "AssetIntegrity"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-results
          path: asset-results

  # ─── NIGHTLY: Slow EditMode tests (difficulty ladder, tactics stats) ───
  slow-tests:
    name: Slow EditMode Tests
    runs-on: ubuntu-latest
    needs: license-check
    if: needs.license-check.outputs.ok == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: slow-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Slow EditMode Tests
          customParameters: -testCategory "Slow"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-results
          path: slow-results
